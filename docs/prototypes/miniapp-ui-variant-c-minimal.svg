      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; letter-spacing: 0; }
      .title { fill: #101828; font-size: 31px; font-weight: 760; }
      .muted { fill: #667085; font-size: 13px; }
      .section { fill: #101828; font-size: 15px; font-weight: 720; }
      .body { fill: #344054; font-size: 14px; }
    </style>
  </defs>
  <rect width="390" height="844" fill="#f5f7fb"/>
  <rect x="16" y="16" width="358" height="812" rx="26" fill="#fbfcfe"/>

