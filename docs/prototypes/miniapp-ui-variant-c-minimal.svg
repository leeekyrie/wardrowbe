  <text x="73" y="374" fill="#fff" font-size="13" font-weight="720">通勤</text>
  <rect x="136" y="350" width="78" height="38" rx="19" fill="#eef2ff"/>
  <text x="161" y="374" fill="#344054" font-size="13" font-weight="650">休闲</text>
  <rect x="224" y="350" width="78" height="38" rx="19" fill="#eef2ff"/>
  <text x="249" y="374" fill="#344054" font-size="13" font-weight="650">约会</text>
